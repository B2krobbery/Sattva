<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pratha — temples, authentic pujas, live darshan, gaushala seva and Rishi Vedic AI. Connect with sacred traditions across India." />
    <meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12100E" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="canonical" href="https://pratha-two.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pratha" />
    <meta property="og:title" content="Pratha — Sacred Traditions, Seva & Live Darshan" />
    <meta property="og:description" content="Discover temples, book authentic pujas, watch live darshan, and support gaushala cow care." />
    <meta property="og:url" content="https://pratha-two.vercel.app/" />
    <script>
      // Set theme before first paint to avoid a flash.
      document.documentElement.dataset.theme =
        localStorage.getItem('pratha-theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <title>Pratha</title>
  </head>
  <body>
    <div id="root">
      <style>
        body { margin: 0; background-color: #FAF8F5; }
        [data-theme='dark'] body { background-color: #12100E; }
        [data-theme='dark'] .web-splash-brand { color: #FAF6EF; }
        .web-splash { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: system-ui, -apple-system, sans-serif; }
        .web-splash-om { font-size: 42px; color: #D15E41; margin-bottom: 12px; font-weight: bold; }
        .web-splash-brand { font-size: 24px; color: #3A322C; font-weight: 700; letter-spacing: 0.1em; }
        .web-splash-spinner { margin-top: 24px; width: 32px; height: 32px; border: 3px solid rgba(209, 94, 65, 0.2); border-top-color: #D15E41; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <div class="web-splash">
        <div class="web-splash-om">ॐ</div>
        <div class="web-splash-brand">PRATHA</div>
        <div class="web-splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
